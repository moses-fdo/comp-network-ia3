! ==============================================================================
! Base System & Security Baseline Configuration
! Target Device: R1-Core (Model: Cisco 2911)
! Generated via Jinja2 Network Automation Toolchain
! Role: CORE_ROUTER | Location: HQ Server Room Rack-01
! ==============================================================================
no service config
service password-encryption
service timestamps debug datetime msec
service timestamps log datetime msec
no ip domain-lookup

hostname R1-Core

ip domain-name novacorp.local

! --- User Credentials & Privilege Hardening ---
username netadmin privilege 15 secret Cisco@123!
enable secret cisco123

! --- Cryptographic Key Generation & SSH v2 Enforcement ---
! In Cisco Packet Tracer or IOS CLI, ensure RSA key exists:
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

! --- Legal Security MOTD Banner ---
banner motd ^C
*******************************************************************************
*                          AUTHORIZED ACCESS ONLY                             *
*                                                                             *
* This device is part of NovaCorp Enterprise Network Infrastructure.         *
* All activities on this device are actively monitored and logged.            *
* Unauthorized access, tampering, or misuse is strictly prohibited and       *
* will be prosecuted under applicable computer crime and cybersecurity laws.  *
*                                                                             *
* Device: R1-Core | Mgmt IP: 192.168.99.1                                   *
*******************************************************************************
^C

! --- Console Port Hardening ---
line con 0
 password cisco123
 login local
 exec-timeout 5 0
 logging synchronous
 history size 50

! --- Auxiliary Port Hardening ---
line aux 0
 no exec
 transport input none
 transport output none
! --- Line VTY Remote Access Configuration (Router) ---
line vty 0 4
 login local
 transport input ssh
 exec-timeout 5 0
 logging synchronous
 history size 50

! ==============================================================================
! Interface Configurations & Router-on-a-Stick (802.1Q Inter-VLAN Routing)
! ==============================================================================
interface GigabitEthernet0/0
 description Uplink Trunk to SW1-Dist Gi0/1
 no ip address
 no shutdown
interface GigabitEthernet0/0.10
 description Engineering Gateway Subinterface
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 no shutdown
interface GigabitEthernet0/0.20
 description HR Gateway Subinterface
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 no shutdown
interface GigabitEthernet0/0.30
 description Sales Gateway Subinterface
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 no shutdown
interface GigabitEthernet0/0.40
 description Server Farm TFTP Gateway Subinterface
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
 no shutdown
interface GigabitEthernet0/0.99
 description Management SVI Gateway Subinterface
 encapsulation dot1Q 99
 ip address 192.168.99.1 255.255.255.0
 no shutdown
interface GigabitEthernet0/1
 description Simulated ISP WAN Uplink
 ip address 203.0.113.1 255.255.255.252
 no shutdown

! ==============================================================================
! DHCP Server Configuration for Departmental Subnets
! ==============================================================================
ip dhcp excluded-address 192.168.10.1 192.168.10.9
ip dhcp excluded-address 192.168.20.1 192.168.20.9
ip dhcp excluded-address 192.168.30.1 192.168.30.9

ip dhcp pool POOL_ENG
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.40.10
 domain-name novacorp.local
ip dhcp pool POOL_HR
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.40.10
 domain-name novacorp.local
ip dhcp pool POOL_SALES
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 192.168.40.10
 domain-name novacorp.local

! ==============================================================================
! Enterprise Routing Engine (Static WAN Default + OSPF Area 0)
! ==============================================================================
! Simulated ISP / WAN Default Route
ip route 0.0.0.0 0.0.0.0 203.0.113.2

! OSPF Interior Gateway Protocol for Campus Routing & Convergence
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 passive-interface GigabitEthernet0/1
 network 192.168.0.0 0.0.255.255 area 0

! ==============================================================================
! Centralized TFTP Config Backup Macro Reference
! Target TFTP Server: 192.168.40.10
! ==============================================================================
! Automated Backup Command:
! copy running-config tftp://192.168.40.10/R1-Core-running-config.cfg

end
write memory
