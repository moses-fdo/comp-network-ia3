! ==============================================================================
! Base System & Security Baseline Configuration
! Target Device: SW1-Dist (Model: Cisco 2960-24TT)
! Generated via Jinja2 Network Automation Toolchain
! Role: DISTRIBUTION_SWITCH | Location: HQ Server Room Rack-02
! ==============================================================================
no service config
service password-encryption
service timestamps debug datetime msec
service timestamps log datetime msec
no ip domain-lookup

hostname SW1-Dist

ip domain-name novacorp.local

! --- User Credentials & Privilege Hardening ---
username netadmin privilege 15 secret Cisco@123!
enable secret cisco123

! --- Cryptographic Key Generation & SSH v2 Enforcement ---
! In Cisco Packet Tracer or IOS CLI, ensure RSA key exists:
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

! --- Legal Security MOTD Banner ---
banner motd ^C
*******************************************************************************
*                          AUTHORIZED ACCESS ONLY                             *
*                                                                             *
* This device is part of NovaCorp Enterprise Network Infrastructure.         *
* All activities on this device are actively monitored and logged.            *
* Unauthorized access, tampering, or misuse is strictly prohibited and       *
* will be prosecuted under applicable computer crime and cybersecurity laws.  *
*                                                                             *
* Device: SW1-Dist | Mgmt IP: 192.168.99.11                                   *
*******************************************************************************
^C

! --- Console Port Hardening ---
line con 0
 password cisco123
 login local
 exec-timeout 5 0
 logging synchronous
 history size 50

! --- Auxiliary Port Hardening ---
line aux 0
 no exec
 transport input none
 transport output none
! --- Line VTY Remote Access Configuration (Catalyst Switch 0-15) ---
line vty 0 4
 login local
 transport input ssh
 exec-timeout 5 0
 logging synchronous
 history size 50
line vty 5 15
 login local
 transport input ssh
 exec-timeout 5 0
 logging synchronous
 history size 50

! ==============================================================================
! VLAN Database Provisioning
! ==============================================================================
vlan 10
 name Engineering
vlan 20
 name HumanResources
vlan 30
 name SalesMarketing
vlan 40
 name ServerFarm
vlan 99
 name Management
vlan 999
 name ParkingLot_Dead

! ==============================================================================
! Spanning Tree Protocol (STP) Hardening - Rapid-PVST+
! ==============================================================================
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,99 root primary

! ==============================================================================
! Active Port Configurations (Trunks, Access Ports, Port Security, SVI)
! ==============================================================================
interface GigabitEthernet0/1
 description Trunk Uplink to R1-Core Gi0/0
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 no shutdown
interface FastEthernet0/1
 description Trunk Downlink to SW2-Eng Fa0/24
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 no shutdown
interface FastEthernet0/2
 description Trunk Downlink to SW3-HR Fa0/24
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 no shutdown
interface FastEthernet0/3
 description Trunk Downlink to SW4-Sales Fa0/24
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 no shutdown
interface FastEthernet0/10
 description Access to TFTP Backup Server
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
interface FastEthernet0/20
 description Access to Admin Management PC
 switchport mode access
 switchport access vlan 99
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
interface Vlan99
 description Management SVI
 ip address 192.168.99.11 255.255.255.0
 no shutdown

! ==============================================================================
! Default Gateway for Switch Management Routing
! ==============================================================================
ip default-gateway 192.168.99.1

! ==============================================================================
! Security Parking Lot: Shut Down Unused Ports into VLAN 999
! ==============================================================================
interface range FastEthernet0/4 - 9, FastEthernet0/11 - 19, FastEthernet0/21 - 23, GigabitEthernet0/2
 description Unused Security Isolation Ports
 switchport mode access
 switchport access vlan 999
 shutdown

! ==============================================================================
! Centralized TFTP Config Backup Macro Reference
! Target TFTP Server: 192.168.40.10
! ==============================================================================
! Automated Backup Command:
! copy running-config tftp://192.168.40.10/SW1-Dist-running-config.cfg

end
write memory
