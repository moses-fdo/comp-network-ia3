! ==============================================================================
! Base System & Security Baseline Configuration
! Target Device: SW4-Sales (Model: Cisco 2960-24TT)
! Generated via Jinja2 Network Automation Toolchain
! Role: ACCESS_SWITCH | Location: Sales Wing IDF-03
! ==============================================================================
no service config
service password-encryption
service timestamps debug datetime msec
service timestamps log datetime msec
no ip domain-lookup

hostname SW4-Sales

ip domain-name novacorp.local

! --- User Credentials & Privilege Hardening ---
username netadmin privilege 15 secret Cisco@123!
enable secret cisco123

! --- Cryptographic Key Generation & SSH v2 Enforcement ---
! In Cisco Packet Tracer or IOS CLI, ensure RSA key exists:
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

! --- Legal Security MOTD Banner ---
banner motd ^C
*******************************************************************************
*                          AUTHORIZED ACCESS ONLY                             *
*                                                                             *
* This device is part of NovaCorp Enterprise Network Infrastructure.         *
* All activities on this device are actively monitored and logged.            *
* Unauthorized access, tampering, or misuse is strictly prohibited and       *
* will be prosecuted under applicable computer crime and cybersecurity laws.  *
*                                                                             *
* Device: SW4-Sales | Mgmt IP: 192.168.99.14                                   *
*******************************************************************************
^C

! --- Console Port Hardening ---
line con 0
 password cisco123
 login local
 exec-timeout 5 0
 logging synchronous
 history size 50

! --- Auxiliary Port Hardening ---
line aux 0
 no exec
 transport input none
 transport output none
! --- Line VTY Remote Access Configuration (Catalyst Switch 0-15) ---
line vty 0 4
 login local
 transport input ssh
 exec-timeout 5 0
 logging synchronous
 history size 50
line vty 5 15
 login local
 transport input ssh
 exec-timeout 5 0
 logging synchronous
 history size 50

! ==============================================================================
! VLAN Database Provisioning
! ==============================================================================
vlan 10
 name Engineering
vlan 20
 name HumanResources
vlan 30
 name SalesMarketing
vlan 40
 name ServerFarm
vlan 99
 name Management
vlan 999
 name ParkingLot_Dead

! ==============================================================================
! Spanning Tree Protocol (STP) Hardening - Rapid-PVST+
! ==============================================================================
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,99 root secondary

! ==============================================================================
! Active Port Configurations (Trunks, Access Ports, Port Security, SVI)
! ==============================================================================
interface FastEthernet0/24
 description Trunk Uplink to SW1-Dist Fa0/3
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 no shutdown
interface FastEthernet0/1
 description Sales Workstation 01
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
interface FastEthernet0/2
 description Sales Workstation 02
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
interface Vlan99
 description Management SVI
 ip address 192.168.99.14 255.255.255.0
 no shutdown

! ==============================================================================
! Default Gateway for Switch Management Routing
! ==============================================================================
ip default-gateway 192.168.99.1

! ==============================================================================
! Security Parking Lot: Shut Down Unused Ports into VLAN 999
! ==============================================================================
interface range FastEthernet0/3 - 23, GigabitEthernet0/1 - 2
 description Unused Security Isolation Ports
 switchport mode access
 switchport access vlan 999
 shutdown

! ==============================================================================
! Centralized TFTP Config Backup Macro Reference
! Target TFTP Server: 192.168.40.10
! ==============================================================================
! Automated Backup Command:
! copy running-config tftp://192.168.40.10/SW4-Sales-running-config.cfg

end
write memory
